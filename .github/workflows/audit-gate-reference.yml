name: Audit Gate Reference

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base-ref:
        description: Local commit or ref used to select changed supported test files.
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit-gate:
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base-ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Audit changed test source and apply explicit gate
        run: |
          set +e
          node dist/cli.js review . --changed-since "$BASE_REF" --format json > audit.json
          audit_exit=$?
          set -e

          if [ "$audit_exit" -eq 2 ]; then
            exit 2
          fi
          if [ "$audit_exit" -ne 0 ] && [ "$audit_exit" -ne 1 ]; then
            echo "Unexpected static audit exit code: $audit_exit." >&2
            exit 2
          fi

          set +e
          node .github/scripts/create-decision-envelope.mjs audit.json > gate-envelope.json
          projection_exit=$?
          set -e
          if [ "$projection_exit" -ne 0 ]; then
            echo "Unexpected audit projection exit code: $projection_exit." >&2
            exit 2
          fi

          set +e
          node dist/cli.js gate .github/ata-gate-policy.json gate-envelope.json > gate.json
          gate_exit=$?
          set -e
          if [ "$gate_exit" -ne 0 ] && [ "$gate_exit" -ne 1 ] && [ "$gate_exit" -ne 2 ]; then
            echo "Unexpected gate exit code: $gate_exit." >&2
            exit 2
          fi

          {
            echo '## Static audit'
            echo '```json'
            cat audit.json
            echo '```'
            echo '## Explicit FAKE-only gate'
            echo '```json'
            cat gate.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$gate_exit"
